name: tarefas_geo
description: "Tarefas Geo — gerenciador de tarefas com geolocalização. Projeto da Pós-Graduação em Desenvolvimento Mobile (disciplina: Desenvolvimento Mobile com Flutter)."

publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6
  intl: ^0.20.2

  # Gerenciamento de estado.
  provider: ^6.1.2

  # GPS + permissões nativas (API do aparelho).
  geolocator: ^13.0.1

  # Mapa OpenStreetMap (sem necessidade de API key — funciona out-of-the-box).
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Firebase: persistência das tarefas no Cloud Firestore.
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4

  # Package interno: cliente OpenWeather (API REST) + utilitários de geolocalização.
  geo_tools:
    path: packages/geo_tools

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Testes de interface (UI) que rodam no dispositivo/emulador.
  integration_test:
    sdk: flutter
  # Firestore em memória para testar o repositório sem rede.
  fake_cloud_firestore: ^3.1.0
  # Mocks para os testes (ex.: WeatherClient).
  mocktail: ^1.0.4
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "#7E57C2"
  adaptive_icon_foreground: "assets/icons/icon-adaptive.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Regular.ttf
        - asset: assets/fonts/Quicksand-Bold.ttf
          weight: 700
